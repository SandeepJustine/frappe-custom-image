# Coolify deployment compose file.
#
# This mirrors the structure of frappe_docker's own pwd.yml / production
# compose (mariadb + redis-cache + redis-queue + a one-shot "configurator"
# + backend + websocket + scheduler + queue workers + frontend/nginx) but
# points `image:` at the custom image this repo's CI publishes to GHCR
# instead of the stock frappe/erpnext image.
#
# IMPORTANT: the "configurator" service below is not optional. Frappe's
# backend and the Node.js realtime/socketio service read Redis/DB
# connection details from sites/common_site_config.json, NOT from
# environment variables directly. configurator is a one-shot container
# that runs `bench set-config` to write that file, then exits
# successfully; every long-running service depends_on it with
# `condition: service_completed_successfully` so it always runs first.
# Skipping it is what causes `ECONNREFUSED 127.0.0.1:6379` on websocket/
# backend — they fall back to Node's/Frappe's default of localhost.
#
# See COOLIFY_DEPLOYMENT.md for the full walkthrough, including the
# one-time `bench new-site` step and common Coolify-specific gotchas.

x-customizable-image: &customizable_image
  image: ${CUSTOM_IMAGE:-ghcr.io/sandeepjustine/erpnext-custom}:${CUSTOM_TAG:-latest}
  pull_policy: always
  restart: unless-stopped

x-depends-on-configurator: &depends_on_configurator
  depends_on:
    configurator:
      condition: service_completed_successfully

services:
  mariadb:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - redis-cache-data:/data

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

  # One-shot: writes db_host/redis_cache/redis_queue/socketio_port into
  # sites/common_site_config.json, then exits 0. Everything else waits
  # on it. Re-runs on every `docker compose up` / Coolify redeploy, which
  # is safe and idempotent (bench set-config just overwrites the keys).
  configurator:
    <<: *customizable_image
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host "$$DB_HOST";
        bench set-config -gp db_port "$$DB_PORT";
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port "$$SOCKETIO_PORT";
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      mariadb:
        condition: service_healthy
    restart: "no"

  backend:
    <<: [*customizable_image, *depends_on_configurator]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    # entrypoint/command inherited from the image; frappe_docker's
    # layered image already knows how to start gunicorn for the backend
    # role via the base entrypoint script.

  websocket:
    <<: [*customizable_image, *depends_on_configurator]
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  queue-short:
    <<: [*customizable_image, *depends_on_configurator]
    command: ["bench", "worker", "--queue", "short,default"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  queue-long:
    <<: [*customizable_image, *depends_on_configurator]
    command: ["bench", "worker", "--queue", "long,default,short"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  scheduler:
    <<: [*customizable_image, *depends_on_configurator]
    command: ["bench", "schedule"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  frontend:
    <<: *customizable_image
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:?set SITE_NAME}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      # Coolify's own Traefik/Caddy layer terminates TLS and proxies to
      # this container's port 8080 — do not publish 80/443 directly.
      - "8080"
    depends_on:
      - backend
      - websocket

volumes:
  mariadb-data:
  redis-cache-data:
  redis-queue-data:
  sites:
  logs:
