name: Build ERPNext Custom Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: erpnext-custom
  FRAPPE_BRANCH: version-16

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha,format=short
          type=raw,value=latest
          type=raw,value=${{ github.ref_name }}
        sep-tags: ','

    - name: Prepare build arguments
      id: prep
      run: |
        if [ -f "apps.json" ]; then
          echo "apps_json_base64=$(base64 -w 0 apps.json)" >> $GITHUB_OUTPUT
        else
          echo "⚠️ apps.json not found!"
          exit 1
        fi

    - name: Build and push
      uses: docker/bake-action@v5
      with:
        files: docker-bake.hcl
        targets: custom-apps
        push: true
        set: |
          custom-apps.args.FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
          custom-apps.args.APPS_JSON_BASE64=${{ steps.prep.outputs.apps_json_base64 }}
          custom-apps.args.TAGS=${{ steps.meta.outputs.tags }}
      env:
        # Remove this line since we're using set instead
        DOCKER_METADATA_OUTPUT_TAGS: ${{ steps.meta.outputs.tags }}

    - name: Verify image
      run: |
        echo "✅ Image built successfully!"
        echo "Tags: ${{ steps.meta.outputs.tags }}"