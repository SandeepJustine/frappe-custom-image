name: Build ERPNext Custom Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: erpnext-custom

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha
          type=raw,value=latest
        sep-tags: ','

    - name: Prepare build arguments
      id: prep
      run: |
        echo "apps_json_base64=$(base64 -w 0 apps.json)" >> $GITHUB_OUTPUT

    - name: Build and push
      uses: docker/bake-action@v5
      with:
        files: docker-bake.hcl
        targets: custom-apps
        push: true
        set: |
          custom-apps.args.APPS_JSON_BASE64=${{ steps.prep.outputs.apps_json_base64 }}
      env:
        DOCKER_METADATA_OUTPUT_TAGS: ${{ steps.meta.outputs.tags }}
        # You can also pass these if you want to override HCL defaults:
        # BAKE_REGISTRY: ${{ env.REGISTRY }}
        # BAKE_REGISTRY_NAMESPACE: ${{ github.repository_owner }}

    - name: Verify image
      run: |
        echo "Image built:"
        echo "${{ steps.meta.outputs.tags }}"